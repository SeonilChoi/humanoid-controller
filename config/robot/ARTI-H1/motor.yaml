# kp / kd: PD gains every program sends as motor_command_ kp / kd while it controls the motor (homing uses the
# homing_* gains). DRIVER units: Unitree = rotor side (joint side x gear_ratio^2 = x 40.07), CubeMars MIT = output side.
# min / max: joint limits after homing (rad). The homing side equals homing_offset (the stopper), so no command
# ever pushes past the stopper; the other side is the free end of the joint.
# Branch arti-h1-new-pelvis: hip_pitch / knee / ankle_pitch use the -20/40/-20 URDF zero (was -45/90/-45), same physical
# stoppers: q_new = q_old + (hip_pitch +25, knee -50, ankle_pitch -25 deg), so min / max / homing_offset are shifted.
masters:
  - id: 0
    period: 8000 # microseconds
    type: unitree
    device: /dev/Unitree

    motors:
      - id: 1
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -0.7056
        max:  0.7056
        homing_direction: 1
        homing_offset: 0.7187    # 11-26 jig (--no-torque): read -0.75 deg at joint zero, was 0.7056
        homing_velocity: 0.3
        homing_kp: 0.3
        homing_kd: 0.025
        homing_zero_kp: 1.0
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.0
        homing_velocity_threshold: 0.1

      - id: 2
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -0.7056
        max:  0.7056
        homing_direction: 1
        homing_offset: 0.6899    # 11-26 jig (--no-torque): read +0.90 deg at joint zero, was 0.7056
        homing_velocity: 0.3
        homing_kp: 0.3
        homing_kd: 0.025
        homing_zero_kp: 1.0
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.0
        homing_velocity_threshold: 0.1

      - id: 3
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -0.2854
        max:  0.4
        homing_direction: -1
        homing_offset: -0.3044    # 11-26 jig (--no-torque): read +1.09 deg at joint zero, was -0.2854
        homing_velocity: 0.3
        homing_kp: 0.45    # 11-11: raised with the threshold (stall push ~ kp * 0.15 rad lead)
        homing_kd: 0.025
        homing_zero_kp: 1.2
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.5    # 11-11: raised so friction alone is not taken for the stopper
        homing_velocity_threshold: 0.2

      - id: 4
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -0.2854
        max:  0.4
        homing_direction: -1
        homing_offset: -0.3102    # 11-26 jig (--no-torque): read +1.42 deg at joint zero, was -0.2854
        homing_velocity: 0.3
        homing_kp: 0.45    # 11-11: raised with the threshold (stall push ~ kp * 0.15 rad lead)
        homing_kd: 0.025
        homing_zero_kp: 1.0
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.5    # 11-11: raised so friction alone is not taken for the stopper
        homing_velocity_threshold: 0.1

      - id: 5
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -0.3041
        max:  0.9363
        homing_direction: -1
        homing_offset: -0.3594    # 11-26 jig (--no-torque): read +3.17 deg at joint zero, was -0.3041
        homing_velocity: 0.3
        homing_kp: 0.3
        homing_kd: 0.025
        homing_zero_kp: 1.0
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.0
        homing_velocity_threshold: 0.1

      - id: 6
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -0.3041
        max:  0.9363
        homing_direction: -1
        homing_offset: -0.3156    # 11-26 jig (--no-torque): read +0.66 deg at joint zero, was -0.3041
        homing_velocity: 0.3
        homing_kp: 0.3
        homing_kd: 0.025
        homing_zero_kp: 1.0
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.0
        homing_velocity_threshold: 0.1

      - id: 7
        gear_ratio: 6.33
        kp: 2.5    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -1.3727
        max:  0.6531
        homing_direction: 1
        homing_offset: 0.7412    # 11-26 jig (--no-torque): read -5.05 deg at joint zero, was 0.6531
        homing_velocity: 0.3
        homing_kp: 0.3
        homing_kd: 0.025
        homing_zero_kp: 1.0
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.0
        homing_velocity_threshold: 0.1

      - id: 8
        gear_ratio: 6.33
        kp: 2.5    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -1.3727
        max:  0.6531
        homing_direction: 1
        homing_offset: 0.7027    # 11-26 jig (--no-torque): read -2.84 deg at joint zero, was 0.6531
        homing_velocity: 0.3
        homing_kp: 0.3
        homing_kd: 0.025
        homing_zero_kp: 1.0
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.0
        homing_velocity_threshold: 0.1

  - id: 1
    period: 1000
    type: cubemars
    device: can1

    motors:
      - id: 9
        gear_ratio: 36.0
        kp: 30.0    # motor_command_ gain while controlling (driver units)
        kd: 0.5
        axis: -1
        pulse_per_revolution: 65536
        min: -0.9363
        max:  0.3090
        homing_direction: 1
        homing_offset: 0.4095    # 11-26 jig (--no-torque): read -5.76 deg at joint zero, was 0.3090
        homing_velocity: 0.3
        homing_kp: 10.0
        homing_kd: 0.5
        homing_zero_kp: 30.0
        homing_zero_kd: 1.0
        homing_hold_kp: 5.0
        homing_hold_kd: 0.5
        homing_torque_threshold: 0.8
        homing_velocity_threshold: 0.1

      - id: 10
        gear_ratio: 36.0
        kp: 30.0    # motor_command_ gain while controlling (driver units)
        kd: 0.5
        axis: -1
        pulse_per_revolution: 65536
        min: -0.9363
        max:  0.3090
        homing_direction: 1
        homing_offset: 0.3982    # 11-26 jig (--no-torque): read -5.11 deg at joint zero, was 0.3090
        homing_velocity: 0.3
        homing_kp: 10.0
        homing_kd: 0.5
        homing_zero_kp: 30.0
        homing_zero_kd: 1.0
        homing_hold_kp: 5.0
        homing_hold_kd: 0.5
        homing_torque_threshold: 0.8
        homing_velocity_threshold: 0.1

      - id: 11
        gear_ratio: 36.0
        kp: 30.0    # motor_command_ gain while controlling (driver units)
        kd: 0.5
        axis: -1
        pulse_per_revolution: 65536
        min: -0.7854    # 11-17: free end = URDF ankle_roll limit -45 deg (homing side moved to +27.7 deg)
        max:  0.4835
        homing_direction: 1     # 11-17: was -1 (stopper at -87.2 deg)
        homing_offset: 0.5135    # 11-26 jig (--no-torque): read -1.72 deg at joint zero, was 0.4835
        homing_velocity: 0.3
        homing_kp: 15.0    # 11-11: raised with the threshold (stall push ~ kp * 0.15 rad lead)
        homing_kd: 0.5
        homing_zero_kp: 30.0
        homing_zero_kd: 1.0
        homing_hold_kp: 5.0
        homing_hold_kd: 0.5
        homing_torque_threshold: 1.2    # 11-11: raised so friction alone is not taken for the stopper
        homing_velocity_threshold: 0.1

      - id: 12
        gear_ratio: 36.0
        kp: 30.0    # motor_command_ gain while controlling (driver units)
        kd: 0.5
        axis: -1
        pulse_per_revolution: 65536
        min: -0.7854    # 11-17: free end = URDF ankle_roll limit -45 deg (homing side moved to +27.7 deg)
        max:  0.4835
        homing_direction: 1     # 11-17: was -1 (stopper at -87.2 deg)
        homing_offset: 0.5055    # 11-26 jig (--no-torque): read -1.26 deg at joint zero, was 0.4835
        homing_velocity: 0.3
        homing_kp: 15.0    # 11-11: raised with the threshold (stall push ~ kp * 0.15 rad lead)
        homing_kd: 0.5
        homing_zero_kp: 30.0
        homing_zero_kd: 1.0
        homing_hold_kp: 5.0
        homing_hold_kd: 0.5
        homing_torque_threshold: 1.2    # 11-11: raised so friction alone is not taken for the stopper
        homing_velocity_threshold: 0.1