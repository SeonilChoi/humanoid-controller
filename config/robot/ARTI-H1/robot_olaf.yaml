name: robot

motor_manager_config_file: ../config/robot/ARTI-H1/motor.yaml
sensor_manager_config_file: ../config/robot/ARTI-H1/sensor.yaml
joy_handler_config_file: ../config/robot/ARTI-H1/joy.yaml
urdf_file: ../config/robot/ARTI-H1/robot.urdf
# Olaf-style walking + standing policies (arXiv 2512.16705; training project https://github.com/SeonilChoi/ARTI-H1-Olaf,
# tasks Arti-H1-Olaf-Walk-v0 / Arti-H1-Olaf-Stand-v0 on the knee-bent (KB) robot: same patched USD, stance and
# -20/40/-20 joint zero as r21 / kb10, so motor.yaml homing on this branch is unchanged). Run with
#   ./ARTI-H1 ../config/robot/ARTI-H1/robot_olaf.yaml
# The robot starts in the STAND policy; pad: cross = WALK policy, circle = STAND policy.
#   WALK : left stick = path velocity vx (up / down) and vy (left / right), right stick left / right = turn
#   STAND: left stick up / down = trunk pitch (up = nose down), left / right = roll (right = lean right),
#          right stick left / right = trunk yaw, up / down = trunk height
# Export: arti_h1_olaf scripts/export_onnx.py --checkpoint <run>/checkpoints/agent_N.pt --out agent_olaf_walk_N.onnx
# (and the stand run -> agent_olaf_stand_N.onnx); olaf_walk_keys.yaml comes from the same script (--keys_out).
model_file: ../config/robot/ARTI-H1/agent_olaf_walk.onnx
log_file: ./arti_h1_olaf_run

motors:
  - name: left_hip_yaw
    index: 0
  - name: right_hip_yaw
    index: 1
  - name: left_hip_roll
    index: 2
  - name: right_hip_roll
    index: 3
  - name: left_hip_pitch
    index: 4
  - name: right_hip_pitch
    index: 5
  - name: left_knee
    index: 6
  - name: right_knee
    index: 7
  - name: left_ankle_pitch
    index: 8
  - name: right_ankle_pitch
    index: 9
  - name: left_ankle_roll
    index: 10
  - name: right_ankle_roll
    index: 11

sensors:
  - name: imu_body
    index: 0
    frame: pelvis
    translation: [0.04688, 0.0, 0.34667]
    orientation: [0.0, 0.0, 0.0, 1.0]

# Sole centre in each foot link (ARTI_H1_*_FOOT_OFFSET_FROM_FOOT_LINK); used by the olaf state estimate.
foots:
  - name: left_foot_link
    offset: [-0.026, 0.0, -0.051]
  - name: right_foot_link
    offset: [-0.026, 0.0, -0.051]

# Policy settings; must match ArtiH1OlafEnvCfg (arti_h1_olaf olaf_env_cfg.py).
# ONNX input obs [1, 80] (walk) / [1, 79] (stand), see ARTI_H1.hpp 'olaf'; outputs "actions" (fed back as a(t)) and
# "q_des" (= clamp(default + per-joint scale * actions, real limits, hip_roll +-15 deg)). The controller then applies
# the target low-pass and the rate limit below (same as training) and sends that.
policy:
  observation: olaf
  target_rate_limit: 5.24
  target_lowpass_alpha: 0.6
  control_dt: 0.0166666667
  gait_phase_rate: 0.0          # unused (olaf keeps its own clock: olaf.walk_period)
  initial_gait_phase: 0.0
  gait_rest_phases: []
  stand_command_threshold: 0.0
  max_tilt: 0.7
  imu_still_time: 10
  imu_converge_tolerance: 0.5
  imu_converge_timeout: 180
  imu_attitude_gain: 0.5
  imu_stale_time: 0.2
  fault_settle_time: 1.0
  joy_loss_hold: false
  stick_deadzone: 0.1
  command_scale: [1.0, 1.0, 1.0]   # unused by olaf
  command_max: [0.15, 0.068, 0.4]  # unused by olaf (olaf.walk_command_range)
  default_pose: [0.0, 0.0, 0.0, 0.0, 0.33555, 0.33555, -0.67109, -0.67109, -0.33555, -0.33554, 0.0, 0.0]

olaf:
  stand_model_file: ../config/robot/ARTI-H1/agent_olaf_stand.onnx
  walk_keys_file: ../config/robot/ARTI-H1/olaf_walk_keys.yaml
  reference_knn: 4
  walk_period: 0.8              # s, reference gait period
  walk_start_phase: 0.92        # clock when the WALK policy starts from standing (training reset_stand_pose)
  path_max_distance: 0.10       # m
  path_max_yaw: 0.35            # rad
  stand_path_tau: 0.5           # s
  thermal_clip: [70.0, 85.0]    # C, temperature observation clip
  # control input ranges = training (full stick = max / min)
  walk_command_range: [[-0.12, 0.15], [-0.068, 0.068], [-0.40, 0.40]]       # vx m/s, vy m/s, wz rad/s
  stand_command_range: [[-0.03, 0.015], [-0.10, 0.10], [-0.15, 0.15], [-0.30, 0.30]]   # dz m, roll, pitch, yaw rad
  stand_command_rate: [0.05, 0.3, 0.3, 0.5]                                  # per second
  # state estimate (training est_contact_tolerance / est_velocity_tau)
  contact_tolerance: 0.012
  velocity_tau: 0.03
